name: Generate LL Team Priorities Dashboard

on:
  # Manual trigger — click "Run workflow" button in Actions tab
  workflow_dispatch:
  
  # Scheduled trigger — every Monday at 8:00 AM Pacific (16:00 UTC)
  schedule:
    - cron: '0 16 * * 1'
  
  # Auto-trigger when Gantt file or script changes
  push:
    paths:
      - 'LL_Team_Gantt_Heatmap_050126.xlsm'
      - 'generate_ll_priorities.py'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install pandas openpyxl
      
      - name: Generate dashboard
        run: |
          python generate_ll_priorities.py \
            "LL_Team_Gantt_Heatmap_050126.xlsm" \
            "LL_Team_Priorities_Dashboard.html" \
            "LAUSD_wordmark_RGB.svg" \
            "LAUSD_seal.svg"
      
      - name: Commit dashboard back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LL_Team_Priorities_Dashboard.html
          git diff --staged --quiet || git commit -m "Auto-update dashboard $(date +'%Y-%m-%d %H:%M')"
          git push
      
      - name: Upload dashboard as artifact
        uses: actions/upload-artifact@v7
        with:
          name: LL_Team_Priorities_Dashboard
          path: LL_Team_Priorities_Dashboard.html
          retention-days: 90
