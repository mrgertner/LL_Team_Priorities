name: Generate LL Team Priorities Dashboard

on:
  workflow_dispatch:
  schedule:
    - cron: '0 16 * * 1'
  push:
    paths:
      - 'LL_Team_Gantt_Heatmap_050126.xlsm'
      - 'generate_ll_priorities.py'

# Prevent multiple runs from clashing — queue them instead of running in parallel
concurrency:
  group: dashboard-generation
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          # Fetch full history so we can pull/rebase cleanly
          fetch-depth: 0
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      
      - name: Install dependencies
        run: pip install pandas openpyxl
      
      - name: Generate dashboard
        run: |
          python generate_ll_priorities.py \
            "LL_Team_Gantt_Heatmap_050126.xlsm" \
            "LL_Team_Priorities_Dashboard.html" \
            "LAUSD_wordmark_RGB.svg" \
            "LAUSD_seal.svg"
      
      - name: Commit dashboard back to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add LL_Team_Priorities_Dashboard.html

          # Skip if nothing actually changed
          if git diff --staged --quiet; then
            echo "✅ Dashboard unchanged — nothing to commit"
            exit 0
          fi

          git commit -m "Auto-update dashboard $(date +'%Y-%m-%d %H:%M')"

          # Push with retry — handles race conditions if main has moved
          for attempt in 1 2 3 4 5; do
            echo "Push attempt $attempt..."
            if git push; then
              echo "✅ Push succeeded"
              exit 0
            fi
            echo "⚠️  Push rejected — pulling latest and retrying"
            git pull --rebase origin main
            sleep 3
          done

          echo "❌ Push failed after 5 attempts"
          exit 1
      
      - name: Upload dashboard as artifact
        uses: actions/upload-artifact@v7
        with:
          name: LL_Team_Priorities_Dashboard
          path: LL_Team_Priorities_Dashboard.html
          retention-days: 90
